{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIGHT ONE PT V1 REPORT SYSTEM</title>
  <meta name="description" content="트레이너 회원관리 SaaS 서비스, AI 기반 비의료적 컨디셔닝 케어">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: #112849;
      font-family: Inter, "Noto Sans KR", sans-serif;
      background: #eef5fb;
      letter-spacing: 0;
    }

    .login-demo {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      background: #eef5fb;
    }

    .login-showcase {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .login-showcase::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.08), transparent 55%);
      pointer-events: none;
    }

    .login-access {
      position: absolute;
      top: clamp(16px, 2.4vh, 28px);
      left: clamp(26px, 4.3vw, 76px);
      width: min(300px, calc(100% - 52px));
      padding: 14px;
      border: 1px solid rgba(198, 215, 231, 0.86);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 18px 46px rgba(41, 78, 117, 0.15);
      backdrop-filter: blur(14px);
    }

    .login-access h1,
    .login-access > p {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .login-label {
      display: block;
      margin-bottom: 8px;
      color: #2d67f6;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.11em;
    }

    .login-field { margin-bottom: 8px; }
    .login-field label { display: block; margin-bottom: 4px; color: #304767; font-size: 12px; font-weight: 800; }
    .login-field input {
      width: 100%;
      min-height: 36px;
      border: 1px solid #ccdaea;
      border-radius: 6px;
      padding: 6px 9px;
      color: #112849;
      background: rgba(255, 255, 255, 0.96);
      font: inherit;
      font-size: 13px;
    }

    .login-field input:focus { outline: 3px solid rgba(31, 111, 255, 0.16); border-color: #2d67f6; }
    .login-submit {
      width: 100%;
      min-height: 36px;
      margin-top: 3px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: linear-gradient(135deg, #2d67f6, #1735a6);
      box-shadow: 0 10px 22px rgba(45, 103, 246, 0.23);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .login-submit:hover { background: linear-gradient(135deg, #2458df, #122c8c); }
    .login-error { margin: 0 0 10px; padding: 8px 9px; border-radius: 6px; color: #a6213b; background: #fff0f2; font-size: 12px; }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .login-demo {
        display: grid;
        grid-template-rows: 270px auto;
        min-height: 100vh;
        padding: 0 18px 24px;
        background: linear-gradient(180deg, #eff6fb, #fff);
      }

      .login-showcase {
        position: relative;
        width: calc(100% + 36px);
        height: 270px;
        margin-left: -18px;
        object-position: left center;
      }

      .login-access {
        position: relative;
        top: auto;
        left: auto;
        width: min(420px, 100%);
        margin: -8px auto 0;
        align-self: start;
      }
    }
  </style>
</head>
<body>
  <main class="login-demo">
    <img class="login-showcase" src="{% static 'lightone/studio/report_system_showcase.png' %}" alt="LIGHT ONE PT V1 REPORT SYSTEM 트레이너 회원관리 SaaS 서비스와 AI 기반 비의료적 컨디셔닝 케어">

    <section class="login-access" aria-label="LIGHT ONE 데모 로그인">
      <h1>LIGHT ONE PT V1 REPORT SYSTEM</h1>
      <p>트레이너 회원관리 SaaS 서비스. AI 기반 비의료적 컨디셔닝 케어.</p>
      <span class="login-label">DEMO ACCESS</span>
      {% if form.errors %}<p class="login-error">아이디 또는 비밀번호를 다시 확인해주세요.</p>{% endif %}
      <form method="post">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="login-field">
          <label for="id_username">아이디</label>
          <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
        </div>
        <div class="login-field">
          <label for="id_password">비밀번호</label>
          <input type="password" name="password" id="id_password" autocomplete="current-password" required>
        </div>
        <button class="login-submit" type="submit">데모 콘솔 열기</button>
      </form>
    </section>
  </main>
</body>
</html>
