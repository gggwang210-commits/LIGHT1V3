# LIGHT ONE V2 MVP CI
# 비의료 PT 상담 리포트 SaaS의 Django 실행 가능성과 QS/JATC 엔진을 점검합니다.

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r lightone_v2_django/requirements.txt

      - name: Lint syntax and undefined names
        run: |
          flake8 lightone_v2_django --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 lightone_v2_django --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Django check
        run: |
          cd lightone_v2_django
          python manage.py check

      - name: Django tests
        run: |
          cd lightone_v2_django
          python manage.py test

      - name: Pytest
        run: |
          cd lightone_v2_django
          pytest
