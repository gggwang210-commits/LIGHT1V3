name: Django CI

on:
  push:
    branches:
      - Main-ONE
      - "agent/**"
      - "security/**"
  pull_request:
    branches:
      - Main-ONE

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            lightone_v2_django/requirements.txt

      - name: Create ephemeral test configuration
        shell: python
        run: |
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SECRET_KEY={secrets.token_urlsafe(50)}\n")
              env_file.write("DEBUG=False\n")
              env_file.write("ALLOWED_HOSTS=127.0.0.1,localhost,testserver\n")

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint fatal Python errors
        run: python -m flake8 lightone_v2_django --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run QS and routing smoke test
        working-directory: lightone_v2_django
        run: |
          python - <<'PY'
          from lightone.algorithms import SAFETY_NOTICE, calculate_jatc, calculate_qs, route_session
          from lightone.utils.qs_calculator import determine_routing

          qs = calculate_qs(form_accuracy=80, discomfort_response=2, rpe=7, qc_score=90)
          assert qs == 85.0, qs
          jatc = calculate_jatc(qs, form_accuracy=80, discomfort_response=2, rpe=7)
          assert route_session(qs, jatc, 2, "PASS") == "AUTO"
          assert route_session(65, 65, 4, "PASS") == "REVIEW"
          assert route_session(80, 80, 8, "PASS") == "BLOCK"
          assert determine_routing(95, 1, safety_flags=["manual_stop"]) == "BLOCK"
          assert determine_routing(95, 8) == "BLOCK"
          assert determine_routing(80, 3) == "AUTO"
          assert determine_routing(95, 4) == "REVIEW"
          assert "비의료 운동상담 참고" in SAFETY_NOTICE
          PY

      - name: Run Django checks and tests
        working-directory: lightone_v2_django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - name: Run repository tests
        run: python -m pytest tests -q
