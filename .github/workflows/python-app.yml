# This workflow installs Django MVP dependencies, runs a minimal flake8 gate, and executes a QS smoke test.
# Keep the working path aligned with the actual app root: lightone_v2_django.

name: Python application

on:
  push:
    branches: [ "Main-ONE" ]
  pull_request:
    branches: [ "Main-ONE" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Create ephemeral test configuration
      shell: python
      run: |
        import os
        import secrets

        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
            env_file.write(f"SECRET_KEY={secrets.token_urlsafe(50)}\n")
            env_file.write("DEBUG=False\n")
            env_file.write("ALLOWED_HOSTS=127.0.0.1,localhost,testserver\n")

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f lightone_v2_django/requirements.txt ]; then pip install -r lightone_v2_django/requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names.
        flake8 lightone_v2_django --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat style findings as warnings for MVP velocity.
        flake8 lightone_v2_django --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: QS and routing smoke test
      run: |
        cd lightone_v2_django
        python - <<'PY'
        from lightone.algorithms import SAFETY_NOTICE, calculate_jatc, calculate_qs, route_session
        from lightone.utils.qs_calculator import determine_routing

        qs = calculate_qs(form_accuracy=80, discomfort_response=2, rpe=7, qc_score=90)
        assert qs == 85.0, qs
        jatc = calculate_jatc(qs, form_accuracy=80, discomfort_response=2, rpe=7)
        assert route_session(qs, jatc, 2, 'PASS') == 'AUTO'
        assert route_session(65, 65, 4, 'PASS') == 'REVIEW'
        assert route_session(80, 80, 8, 'PASS') == 'BLOCK'
        assert determine_routing(95, 1, safety_flags=['manual_stop']) == 'BLOCK'
        assert determine_routing(95, 8) == 'BLOCK'
        assert determine_routing(80, 3) == 'AUTO'
        assert determine_routing(95, 4) == 'REVIEW'
        assert '비의료 운동상담 참고' in SAFETY_NOTICE
        PY

    - name: Validate Django project
      run: |
        cd lightone_v2_django
        python manage.py check
        python manage.py makemigrations --check --dry-run
        python manage.py test

    - name: Validate repository documents
      run: python -m pytest tests -q
